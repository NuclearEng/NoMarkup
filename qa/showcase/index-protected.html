<script>
document.getElementById('f').onsubmit=async function(e){
e.preventDefault();
const pw=document.getElementById('pw').value;
const b64=document.getElementById('payload').textContent;
const buf=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const salt=buf.slice(0,16);
const iv=buf.slice(16,28);
const tag=buf.slice(28,44);
const data=buf.slice(44);
try{
const keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);
const combined=new Uint8Array(data.length+tag.length);
combined.set(data);combined.set(tag,data.length);
const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,combined);
const html=new TextDecoder().decode(dec);
document.open();document.write(html);document.close();
}catch(err){document.getElementById('err').style.display='block'}
};
</script>
