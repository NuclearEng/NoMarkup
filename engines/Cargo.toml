[workspace]
resolver = "2"
members = [
    "telemetry",
    "bidding",
    "fraud",
    "trust",
    "imaging",
    "underwriting",
    "pricing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["NoMarkup Engineering"]
license = "proprietary"

# Workspace-wide lint bar (CLAUDE.md §5): clippy pedantic+nursery, unsafe_code denied.
# Member crates opt in with `[lints] workspace = true`. CI runs clippy with
# `-D warnings`, so "warn" here is effectively deny in the pipeline while staying
# overridable via targeted #[allow(...)] at module/crate level.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Groups at priority -1 so targeted per-lint overrides (here or in crate roots) win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Accepted nursery noise (workspace-wide, documented exceptions):
# - missing_const_for_fn: const-ness is an API commitment we don't want dictated
#   by what the current compiler happens to accept; fires on trivial constructors.
# - option_if_let_else: explicit match/if-let over Option is frequently clearer
#   than map_or_else chains; readability call, no correctness impact.
missing_const_for_fn = "allow"
option_if_let_else = "allow"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tonic-health = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
tracing-opentelemetry = "0.28"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
# 0.14+ required: 0.13 depends on protobuf 2.x (RUSTSEC-2024-0437, fixed in protobuf >= 3.7.2)
prometheus = "0.14"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.4", default-features = false }
pin-project-lite = "0.2"
nomarkup-engine-telemetry = { path = "telemetry" }
tower-http = { version = "0.5", default-features = false, features = ["catch-panic"] }
once_cell = "1"
