[package]
name = "nomarkup-pricing-engine"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
name = "pricing"
path = "src/lib.rs"

[[bin]]
name = "nomarkup-pricing-engine"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tonic.workspace = true
tonic-health.workspace = true
prost.workspace = true
prost-types.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
nomarkup-engine-telemetry.workspace = true
# Panic boundary for the gRPC stack (CatchPanicLayer) — see src/main.rs.
http.workspace = true
tower.workspace = true
tower-http.workspace = true

# Optional ONNX inference (ort) for learned pricing model.
# Off by default — see CLAUDE.md ("ML Inference: RESERVED for v2").
# Enable locally: cargo build -p nomarkup-pricing-engine --features ort
# The training lives in ../../ml/pricing (produces .onnx).
[features]
ort = []  # placeholder; real dep would be ort = { version = "...", features = ["load-dynamic"] } when activated.

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "fair_price"
harness = false
