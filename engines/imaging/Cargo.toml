[package]
name = "nomarkup-imaging-engine"
version.workspace = true
edition.workspace = true

[lib]
name = "imaging"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
tonic.workspace = true
tonic-health.workspace = true
prost.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
uuid.workspace = true
chrono.workspace = true
image = "0.25"
# default-features = false drops the legacy `rustls` feature (hyper 0.14 + rustls 0.21 +
# rustls-webpki 0.101, which has unfixable RUSTSEC advisories on the 0.101 line).
# `default-https-client` is the supported hyper 1.x + rustls 0.23 stack.
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
prometheus.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
tower.workspace = true
tower-http.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "imaging_bench"
harness = false
