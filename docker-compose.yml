services:
  # ── Infrastructure ─────────────────────────────────────────

  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: nomarkup
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nomarkup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomarkup"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 3s

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      DATABASE_URL: postgres://nomarkup:password@postgres:5432/nomarkup
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 100
      MAX_CLIENT_CONN: 500
      MAX_DB_CONNECTIONS: 150
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 2s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 2s

  meilisearch:
    image: getmeili/meilisearch:v1.6
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 3s

  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:14269/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 3s

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      gateway:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - alertmanagerdata:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 3s

  # ── Go Microservices ───────────────────────────────────────

  user:
    build:
      context: .
      dockerfile: deploy/docker/user.Dockerfile
    environment:
      DATABASE_URL: "postgresql://nomarkup:password@pgbouncer:5432/nomarkup?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      USER_SERVICE_PORT: "50051"
      JWT_PRIVATE_KEY_PATH: "/keys/private.pem"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      NOTIFICATION_SERVICE_ADDR: "notification:50059"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "user-service"
    volumes:
      - ./keys:/keys:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification:
        condition: service_started

  job:
    build:
      context: .
      dockerfile: deploy/docker/job.Dockerfile
    environment:
      DATABASE_URL: "postgresql://nomarkup:password@pgbouncer:5432/nomarkup?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      JOB_SERVICE_PORT: "50052"
      # Fair-Price engine (feature is off when unset — wire it in-network).
      PRICING_ENGINE_ADDR: "pricing:50061"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "job-service"
      MEILISEARCH_HOST: "http://meilisearch:7700"
      MEILISEARCH_API_KEY: "masterKey"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  payment:
    build:
      context: .
      dockerfile: deploy/docker/payment.Dockerfile
    environment:
      DATABASE_URL: "postgresql://nomarkup:password@pgbouncer:5432/nomarkup?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      PAYMENT_SERVICE_PORT: "50054"
      # Required at startup (fail-fast): development|staging|production.
      ENVIRONMENT: "development"
      # In-network engine addresses — the binary defaults are localhost, which
      # is wrong inside a container (underwriting would fail closed: no offers).
      TRUST_ENGINE_ADDR: "trust:50057"
      UNDERWRITING_ENGINE_ADDR: "underwriting:50060"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "payment-service"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat:
    build:
      context: .
      dockerfile: deploy/docker/chat.Dockerfile
    environment:
      DATABASE_URL: "postgresql://nomarkup:password@pgbouncer:5432/nomarkup?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      CHAT_SERVICE_PORT: "50055"
      CHAT_WS_PORT: "50065"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "chat-service"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification:
    build:
      context: .
      dockerfile: deploy/docker/notification.Dockerfile
    environment:
      DATABASE_URL: "postgresql://nomarkup:password@pgbouncer:5432/nomarkup?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      NOTIFICATION_SERVICE_PORT: "50059"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "notification-service"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Rust Engines ───────────────────────────────────────────

  bidding:
    build:
      context: .
      dockerfile: deploy/docker/engines.Dockerfile
      target: bidding
    environment:
      DATABASE_URL: "postgresql://nomarkup:password@pgbouncer:5432/nomarkup?sslmode=disable"
      BID_ENGINE_PORT: "50053"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "bidding-engine"
    depends_on:
      pgbouncer:
        condition: service_healthy

  fraud:
    build:
      context: .
      dockerfile: deploy/docker/engines.Dockerfile
      target: fraud
    environment:
      DATABASE_URL: "postgresql://nomarkup:password@pgbouncer:5432/nomarkup?sslmode=disable"
      FRAUD_ENGINE_PORT: "50056"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "fraud-engine"
    depends_on:
      pgbouncer:
        condition: service_healthy

  trust:
    build:
      context: .
      dockerfile: deploy/docker/engines.Dockerfile
      target: trust
    environment:
      DATABASE_URL: "postgresql://nomarkup:password@pgbouncer:5432/nomarkup?sslmode=disable"
      TRUST_ENGINE_PORT: "50057"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "trust-engine"
    depends_on:
      pgbouncer:
        condition: service_healthy

  imaging:
    build:
      context: .
      dockerfile: deploy/docker/engines.Dockerfile
      target: imaging
    environment:
      IMAGING_SERVICE_PORT: "50058"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "imaging-service"
      S3_BUCKET: "nomarkup-dev"
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_URL: "http://localhost:9000/nomarkup-dev"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
      AWS_REGION: "us-east-1"
      RUST_LOG: "info"
    depends_on:
      minio:
        condition: service_healthy

  # Pure-function engines (no DB/IO — deterministic gRPC):

  underwriting:
    build:
      context: .
      dockerfile: deploy/docker/engines.Dockerfile
      target: underwriting
    environment:
      UNDERWRITING_ENGINE_PORT: "50060"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "underwriting-engine"

  pricing:
    build:
      context: .
      dockerfile: deploy/docker/engines.Dockerfile
      target: pricing
    environment:
      PRICING_ENGINE_PORT: "50061"
      RUST_LOG: "info"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "pricing-engine"

  # ── API Gateway ────────────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://nomarkup:password@pgbouncer:5432/nomarkup?sslmode=disable"
      GATEWAY_PORT: "8080"
      JWT_PUBLIC_KEY_PATH: "/keys/public.pem"
      ALLOWED_ORIGINS: "http://localhost:3000"
      SECURE_COOKIES: "false"
      USER_SERVICE_ADDR: "user:50051"
      JOB_SERVICE_ADDR: "job:50052"
      BID_ENGINE_ADDR: "bidding:50053"
      PAYMENT_SERVICE_ADDR: "payment:50054"
      CHAT_SERVICE_ADDR: "chat:50055"
      CHAT_WS_ADDR: "chat:50065"
      FRAUD_ENGINE_ADDR: "fraud:50056"
      TRUST_ENGINE_ADDR: "trust:50057"
      IMAGING_SERVICE_ADDR: "imaging:50058"
      NOTIFICATION_SERVICE_ADDR: "notification:50059"
      REDIS_URL: "redis://redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "api-gateway"
    volumes:
      - ./keys:/keys:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      user:
        condition: service_started
      job:
        condition: service_started
      payment:
        condition: service_started
      chat:
        condition: service_started
      notification:
        condition: service_started
      bidding:
        condition: service_started
      fraud:
        condition: service_started
      trust:
        condition: service_started
      imaging:
        condition: service_started

  # ── Frontend ───────────────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: "http://gateway:8080"
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8080"
    depends_on:
      - gateway

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
  prometheusdata:
  alertmanagerdata:
