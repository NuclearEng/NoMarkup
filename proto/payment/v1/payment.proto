syntax = "proto3";

package nomarkup.payment.v1;

option go_package = "github.com/nomarkup/nomarkup/proto/payment/v1;paymentv1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// ============================================================
// Payment Service — Stripe Connect, escrow, payouts, refunds
// ============================================================

service PaymentService {
  // Stripe onboarding
  rpc CreateStripeAccount(CreateStripeAccountRequest) returns (CreateStripeAccountResponse);
  rpc GetStripeOnboardingLink(GetStripeOnboardingLinkRequest) returns (GetStripeOnboardingLinkResponse);
  rpc GetStripeAccountStatus(GetStripeAccountStatusRequest) returns (GetStripeAccountStatusResponse);
  rpc GetStripeDashboardLink(GetStripeDashboardLinkRequest) returns (GetStripeDashboardLinkResponse);

  // Customer payment methods
  rpc CreateSetupIntent(CreateSetupIntentRequest) returns (CreateSetupIntentResponse);
  rpc ListPaymentMethods(ListPaymentMethodsRequest) returns (ListPaymentMethodsResponse);
  rpc DeletePaymentMethod(DeletePaymentMethodRequest) returns (DeletePaymentMethodResponse);

  // Payments
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);
  rpc ReleaseEscrow(ReleaseEscrowRequest) returns (ReleaseEscrowResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);

  // Refunds
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);

  // Webhooks
  rpc HandleStripeWebhook(HandleStripeWebhookRequest) returns (HandleStripeWebhookResponse);

  // Platform fees
  rpc CalculateFees(CalculateFeesRequest) returns (CalculateFeesResponse);
  rpc GetFeeConfig(GetFeeConfigRequest) returns (GetFeeConfigResponse);

  // Admin
  rpc AdminGetPaymentDetails(AdminGetPaymentDetailsRequest) returns (AdminGetPaymentDetailsResponse);
  rpc AdminListPayments(AdminListPaymentsRequest) returns (AdminListPaymentsResponse);
  rpc AdminUpdateFeeConfig(AdminUpdateFeeConfigRequest) returns (AdminUpdateFeeConfigResponse);

  // Revenue reporting
  rpc GetRevenueReport(GetRevenueReportRequest) returns (GetRevenueReportResponse);

  // Expenses
  rpc CreateExpense(CreateExpenseRequest) returns (CreateExpenseResponse);
  rpc ListExpenses(ListExpensesRequest) returns (ListExpensesResponse);
  rpc DeleteExpense(DeleteExpenseRequest) returns (DeleteExpenseResponse);

  // Working Capital
  rpc RequestAdvance(RequestAdvanceRequest) returns (RequestAdvanceResponse);
  rpc ListAdvances(ListAdvancesRequest) returns (ListAdvancesResponse);
  rpc GetAdvance(GetAdvanceRequest) returns (GetAdvanceResponse);
  rpc ReviewAdvance(ReviewAdvanceRequest) returns (ReviewAdvanceResponse);
  rpc DisburseAdvance(DisburseAdvanceRequest) returns (DisburseAdvanceResponse);
  rpc GetCreditLimit(GetCreditLimitRequest) returns (GetCreditLimitResponse);

  // BNPL Installment Plans
  rpc CreateInstallmentPlan(CreateInstallmentPlanRequest) returns (CreateInstallmentPlanResponse);
  rpc GetInstallmentPlan(GetInstallmentPlanRequest) returns (GetInstallmentPlanResponse);
  rpc ListInstallmentPlans(ListInstallmentPlansRequest) returns (ListInstallmentPlansResponse);

  // Insurance
  rpc ListInsuranceProducts(ListInsuranceProductsRequest) returns (ListInsuranceProductsResponse);
  rpc GetInsuranceQuote(GetInsuranceQuoteRequest) returns (GetInsuranceQuoteResponse);
  rpc PurchaseInsurance(PurchaseInsuranceRequest) returns (PurchaseInsuranceResponse);
  rpc GetInsurancePolicy(GetInsurancePolicyRequest) returns (GetInsurancePolicyResponse);
  rpc ListInsurancePolicies(ListInsurancePoliciesRequest) returns (ListInsurancePoliciesResponse);
  rpc FileInsuranceClaim(FileInsuranceClaimRequest) returns (FileInsuranceClaimResponse);
  rpc GetInsuranceClaim(GetInsuranceClaimRequest) returns (GetInsuranceClaimResponse);
  rpc ReviewInsuranceClaim(ReviewInsuranceClaimRequest) returns (ReviewInsuranceClaimResponse);
  rpc AdminListInsuranceClaims(AdminListInsuranceClaimsRequest) returns (AdminListInsuranceClaimsResponse);
}

// ============================================================
// Payment Messages
// ============================================================

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PROCESSING = 2;
  PAYMENT_STATUS_ESCROW = 3;
  PAYMENT_STATUS_RELEASED = 4;
  PAYMENT_STATUS_COMPLETED = 5;
  PAYMENT_STATUS_FAILED = 6;
  PAYMENT_STATUS_REFUNDED = 7;
  PAYMENT_STATUS_PARTIALLY_REFUNDED = 8;
  PAYMENT_STATUS_DISPUTED = 9;
  PAYMENT_STATUS_CHARGEBACK = 10;
}

message Payment {
  string id = 1;
  string contract_id = 2;
  string milestone_id = 3;
  string recurring_instance_id = 4;
  string customer_id = 5;
  string provider_id = 6;
  int64 amount_cents = 7;
  int64 platform_fee_cents = 8;
  int64 guarantee_fee_cents = 9;
  int64 provider_payout_cents = 10;
  PaymentStatus status = 11;
  string failure_reason = 12;
  int64 refund_amount_cents = 13;
  string refund_reason = 14;
  int32 installment_number = 15;
  int32 total_installments = 16;
  int32 retry_count = 17;
  google.protobuf.Timestamp escrow_at = 18;
  google.protobuf.Timestamp released_at = 19;
  google.protobuf.Timestamp completed_at = 20;
  google.protobuf.Timestamp created_at = 21;
}

message PaymentBreakdown {
  int64 subtotal_cents = 1;
  int64 platform_fee_cents = 2;
  int64 guarantee_fee_cents = 3;
  int64 total_cents = 4;
  int64 provider_payout_cents = 5;
  double fee_percentage = 6;
  double guarantee_percentage = 7;
}

// ============================================================
// Stripe Onboarding RPCs
// ============================================================

message CreateStripeAccountRequest {
  string user_id = 1;
  string email = 2;
  string business_name = 3;
}

message CreateStripeAccountResponse {
  string stripe_account_id = 1;
}

message GetStripeOnboardingLinkRequest {
  string user_id = 1;
  string return_url = 2;
  string refresh_url = 3;
}

message GetStripeOnboardingLinkResponse {
  string onboarding_url = 1;
}

message GetStripeAccountStatusRequest {
  string user_id = 1;
}

message GetStripeAccountStatusResponse {
  bool charges_enabled = 1;
  bool payouts_enabled = 2;
  bool details_submitted = 3;
  repeated string requirements = 4;
}

message GetStripeDashboardLinkRequest {
  string user_id = 1;
}

message GetStripeDashboardLinkResponse {
  string dashboard_url = 1;
}

// ============================================================
// Payment Method RPCs
// ============================================================

message CreateSetupIntentRequest {
  string customer_id = 1;
}

message CreateSetupIntentResponse {
  string client_secret = 1;
}

message PaymentMethod {
  string id = 1;
  string type = 2;  // "card", "apple_pay", "google_pay"
  string last_four = 3;
  string brand = 4;
  int32 exp_month = 5;
  int32 exp_year = 6;
  bool is_default = 7;
}

message ListPaymentMethodsRequest {
  string customer_id = 1;
}

message ListPaymentMethodsResponse {
  repeated PaymentMethod methods = 1;
}

message DeletePaymentMethodRequest {
  string payment_method_id = 1;
  string customer_id = 2;
}

message DeletePaymentMethodResponse {}

// ============================================================
// Payment RPCs
// ============================================================

message CreatePaymentRequest {
  string contract_id = 1;
  string milestone_id = 2;
  string recurring_instance_id = 3;
  string customer_id = 4;
  string provider_id = 5;
  int64 amount_cents = 6;
  nomarkup.common.v1.PaymentTiming payment_timing = 7;
  int32 installment_number = 8;
  int32 total_installments = 9;
  string idempotency_key = 10;
}

message CreatePaymentResponse {
  Payment payment = 1;
  string client_secret = 2;  // for client-side confirmation
}

message ProcessPaymentRequest {
  string payment_id = 1;
  string payment_method_id = 2;
}

message ProcessPaymentResponse {
  Payment payment = 1;
}

message ReleaseEscrowRequest {
  string payment_id = 1;
  string reason = 2;  // "milestone_approved", "completion_approved", "auto_release"
}

message ReleaseEscrowResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
  PaymentBreakdown breakdown = 2;
}

message ListPaymentsRequest {
  string user_id = 1;
  optional string contract_id = 2;
  optional PaymentStatus status_filter = 3;
  nomarkup.common.v1.PaginationRequest pagination = 4;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  nomarkup.common.v1.PaginationResponse pagination = 2;
}

// ============================================================
// Refund RPCs
// ============================================================

message CreateRefundRequest {
  string payment_id = 1;
  int64 amount_cents = 2;  // 0 = full refund
  string reason = 3;
  string initiated_by = 4;  // admin or dispute resolution
}

message CreateRefundResponse {
  Payment payment = 1;
}

// ============================================================
// Webhook RPCs
// ============================================================

message HandleStripeWebhookRequest {
  string payload = 1;
  string signature = 2;
}

message HandleStripeWebhookResponse {
  bool processed = 1;
}

// ============================================================
// Fee RPCs
// ============================================================

message CalculateFeesRequest {
  int64 amount_cents = 1;
  string category_id = 2;
}

message CalculateFeesResponse {
  PaymentBreakdown breakdown = 1;
}

message GetFeeConfigRequest {
  optional string category_id = 1;
}

message GetFeeConfigResponse {
  double fee_percentage = 1;
  double guarantee_percentage = 2;
  int64 min_fee_cents = 3;
  int64 max_fee_cents = 4;
}

// ============================================================
// Admin RPCs
// ============================================================

message AdminGetPaymentDetailsRequest {
  string payment_id = 1;
}

message AdminGetPaymentDetailsResponse {
  Payment payment = 1;
  PaymentBreakdown breakdown = 2;
  string stripe_payment_intent_id = 3;
  string stripe_charge_id = 4;
  string stripe_transfer_id = 5;
}

message AdminListPaymentsRequest {
  optional string user_id = 1;
  optional PaymentStatus status_filter = 2;
  nomarkup.common.v1.DateRange date_range = 3;
  nomarkup.common.v1.PaginationRequest pagination = 4;
}

message AdminListPaymentsResponse {
  repeated Payment payments = 1;
  nomarkup.common.v1.PaginationResponse pagination = 2;
  int64 total_amount_cents = 3;
  int64 total_fees_cents = 4;
}

message AdminUpdateFeeConfigRequest {
  string admin_id = 1;
  optional string category_id = 2;
  double fee_percentage = 3;
  double guarantee_percentage = 4;
  int64 min_fee_cents = 5;
  optional int64 max_fee_cents = 6;
}

message AdminUpdateFeeConfigResponse {
  GetFeeConfigResponse config = 1;
}

// ============================================================
// Revenue RPCs
// ============================================================

message GetRevenueReportRequest {
  nomarkup.common.v1.DateRange date_range = 1;
  string group_by = 2;  // "day", "week", "month"
}

message GetRevenueReportResponse {
  repeated RevenueDataPoint data_points = 1;
  int64 total_gmv_cents = 2;
  int64 total_revenue_cents = 3;
  int64 total_guarantee_fund_cents = 4;
  double effective_take_rate = 5;
}

message RevenueDataPoint {
  google.protobuf.Timestamp period_start = 1;
  int64 gmv_cents = 2;
  int64 revenue_cents = 3;
  int32 transaction_count = 4;
}

// ============================================================
// Expense RPCs
// ============================================================

message Expense {
  string id = 1;
  string provider_id = 2;
  string category = 3;
  string description = 4;
  int64 amount_cents = 5;
  string receipt_url = 6;
  string expense_date = 7;  // YYYY-MM-DD
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateExpenseRequest {
  string provider_id = 1;
  string category = 2;
  string description = 3;
  int64 amount_cents = 4;
  string receipt_url = 5;
  string expense_date = 6;  // YYYY-MM-DD
}

message CreateExpenseResponse {
  Expense expense = 1;
}

message ListExpensesRequest {
  string provider_id = 1;
  string start_date = 2;  // YYYY-MM-DD, optional filter
  string end_date = 3;    // YYYY-MM-DD, optional filter
  nomarkup.common.v1.PaginationRequest pagination = 4;
}

message ListExpensesResponse {
  repeated Expense expenses = 1;
  int64 total_cents = 2;
  nomarkup.common.v1.PaginationResponse pagination = 3;
}

message DeleteExpenseRequest {
  string expense_id = 1;
  string provider_id = 2;  // for ownership check
}

message DeleteExpenseResponse {}

// ============================================================
// Working Capital Advance RPCs
// ============================================================

enum AdvanceStatus {
  ADVANCE_STATUS_UNSPECIFIED = 0;
  ADVANCE_STATUS_REQUESTED = 1;
  ADVANCE_STATUS_APPROVED = 2;
  ADVANCE_STATUS_DISBURSED = 3;
  ADVANCE_STATUS_REPAYING = 4;
  ADVANCE_STATUS_REPAID = 5;
  ADVANCE_STATUS_DEFAULTED = 6;
  ADVANCE_STATUS_REJECTED = 7;
}

message Advance {
  string id = 1;
  string provider_id = 2;
  string contract_id = 3;
  int64 advance_amount_cents = 4;
  int64 fee_cents = 5;
  int64 repaid_cents = 6;
  string status = 7;
  string reviewed_by = 8;
  google.protobuf.Timestamp reviewed_at = 9;
  string rejection_reason = 10;
  google.protobuf.Timestamp disbursed_at = 11;
  google.protobuf.Timestamp repaid_at = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string stripe_transfer_id = 15;
}

message RequestAdvanceRequest {
  string provider_id = 1;
  string contract_id = 2;
  int64 amount_cents = 3;
}

message RequestAdvanceResponse {
  Advance advance = 1;
}

message ListAdvancesRequest {
  string provider_id = 1;  // empty = list all (admin)
  optional string status_filter = 2;
  nomarkup.common.v1.PaginationRequest pagination = 3;
}

message ListAdvancesResponse {
  repeated Advance advances = 1;
  nomarkup.common.v1.PaginationResponse pagination = 2;
}

message GetAdvanceRequest {
  string advance_id = 1;
}

message GetAdvanceResponse {
  Advance advance = 1;
}

message ReviewAdvanceRequest {
  string advance_id = 1;
  string reviewer_id = 2;
  string action = 3;  // "approve" or "reject"
  string reason = 4;  // rejection reason (required if action=reject)
}

message ReviewAdvanceResponse {
  Advance advance = 1;
}

message DisburseAdvanceRequest {
  string advance_id = 1;
  string admin_id = 2;
}

message DisburseAdvanceResponse {
  Advance advance = 1;
  string stripe_transfer_id = 2;
}

message GetCreditLimitRequest {
  string provider_id = 1;
}

message GetCreditLimitResponse {
  string provider_id = 1;
  int64 max_advance_cents = 2;
  int64 total_outstanding_cents = 3;
  int64 available_advance_cents = 4;
  double risk_score = 5;
  int32 jobs_completed = 6;
  int64 total_earnings_cents = 7;
  int64 avg_job_value_cents = 8;
  double on_time_rate = 9;
  google.protobuf.Timestamp last_computed_at = 10;
}

// ============================================================
// BNPL Installment Plan RPCs
// ============================================================

message ScheduledInstallment {
  string id = 1;
  int32 installment_number = 2;
  int64 amount_cents = 3;
  string due_date = 4;  // YYYY-MM-DD
  string status = 5;    // scheduled, processing, paid, failed, retrying
  string payment_id = 6;
  google.protobuf.Timestamp paid_at = 7;
}

message InstallmentPlan {
  string id = 1;
  string contract_id = 2;
  string customer_id = 3;
  string provider_id = 4;
  int64 total_amount_cents = 5;
  int64 bnpl_fee_cents = 6;
  int64 total_with_fee_cents = 7;
  int32 installment_count = 8;
  int64 per_installment_cents = 9;
  double fee_rate = 10;
  string status = 11;  // active, completed, defaulted, cancelled
  google.protobuf.Timestamp provider_paid_at = 12;
  string stripe_provider_transfer_id = 13;
  repeated ScheduledInstallment installments = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

message CreateInstallmentPlanRequest {
  string contract_id = 1;
  string customer_id = 2;
  string provider_id = 3;
  int64 total_amount_cents = 4;
  int32 installment_count = 5;  // 3 or 6
  string payment_method_id = 6;
  string idempotency_key = 7;
}

message CreateInstallmentPlanResponse {
  InstallmentPlan plan = 1;
  string first_installment_client_secret = 2;
}

message GetInstallmentPlanRequest {
  string plan_id = 1;
}

message GetInstallmentPlanResponse {
  InstallmentPlan plan = 1;
}

message ListInstallmentPlansRequest {
  string user_id = 1;
  optional string status_filter = 2;
  nomarkup.common.v1.PaginationRequest pagination = 3;
}

message ListInstallmentPlansResponse {
  repeated InstallmentPlan plans = 1;
  nomarkup.common.v1.PaginationResponse pagination = 2;
}

// ============================================================
// Insurance RPCs
// ============================================================

message InsuranceProduct {
  string id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string coverage_type = 5;
  int32 base_rate_bps = 6;
  int64 min_premium_cents = 7;
  int64 max_coverage_cents = 8;
  int32 coverage_duration_days = 9;
  int64 deductible_cents = 10;
  string terms_markdown = 11;
  bool active = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message InsurancePolicy {
  string id = 1;
  string policy_number = 2;
  string product_id = 3;
  string contract_id = 4;
  string customer_id = 5;
  string provider_id = 6;
  int64 coverage_amount_cents = 7;
  int64 premium_cents = 8;
  int64 deductible_cents = 9;
  string stripe_payment_intent_id = 10;
  string effective_date = 11;  // YYYY-MM-DD
  string expiration_date = 12;  // YYYY-MM-DD
  string status = 13;
  google.protobuf.Timestamp paid_at = 14;
  google.protobuf.Timestamp cancelled_at = 15;
  string cancellation_reason = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

message InsuranceClaim {
  string id = 1;
  string claim_number = 2;
  string policy_id = 3;
  string claimant_id = 4;
  string claim_type = 5;
  string description = 6;
  repeated string evidence_urls = 7;
  int64 claimed_amount_cents = 8;
  int64 assessed_amount_cents = 9;
  string assessor_notes = 10;
  int64 approved_amount_cents = 11;
  int64 payout_cents = 12;
  string stripe_transfer_id = 13;
  string status = 14;
  string denial_reason = 15;
  string reviewed_by = 16;
  google.protobuf.Timestamp reviewed_at = 17;
  google.protobuf.Timestamp paid_at = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}

message InsuranceQuote {
  string product_id = 1;
  string product_name = 2;
  string coverage_type = 3;
  int64 premium_cents = 4;
  int64 coverage_amount_cents = 5;
  int64 deductible_cents = 6;
  int32 coverage_duration_days = 7;
  string effective_date = 8;  // YYYY-MM-DD
  string expiration_date = 9;  // YYYY-MM-DD
}

message ListInsuranceProductsRequest {}

message ListInsuranceProductsResponse {
  repeated InsuranceProduct products = 1;
}

message GetInsuranceQuoteRequest {
  string product_id = 1;
  string contract_id = 2;
  int64 contract_amount_cents = 3;
  string category_slug = 4;
}

message GetInsuranceQuoteResponse {
  InsuranceQuote quote = 1;
}

message PurchaseInsuranceRequest {
  string product_id = 1;
  string contract_id = 2;
  string customer_id = 3;
  string provider_id = 4;
  int64 contract_amount_cents = 5;
}

message PurchaseInsuranceResponse {
  InsurancePolicy policy = 1;
  string client_secret = 2;
}

message GetInsurancePolicyRequest {
  string policy_id = 1;
}

message GetInsurancePolicyResponse {
  InsurancePolicy policy = 1;
}

message ListInsurancePoliciesRequest {
  string user_id = 1;
  nomarkup.common.v1.PaginationRequest pagination = 2;
}

message ListInsurancePoliciesResponse {
  repeated InsurancePolicy policies = 1;
  nomarkup.common.v1.PaginationResponse pagination = 2;
}

message FileInsuranceClaimRequest {
  string policy_id = 1;
  string claimant_id = 2;
  string claim_type = 3;
  string description = 4;
  repeated string evidence_urls = 5;
  int64 claimed_amount_cents = 6;
}

message FileInsuranceClaimResponse {
  InsuranceClaim claim = 1;
}

message GetInsuranceClaimRequest {
  string claim_id = 1;
}

message GetInsuranceClaimResponse {
  InsuranceClaim claim = 1;
}

message ReviewInsuranceClaimRequest {
  string claim_id = 1;
  string reviewer_id = 2;
  bool approved = 3;
  int64 approved_amount_cents = 4;
  string assessor_notes = 5;
  string denial_reason = 6;
}

message ReviewInsuranceClaimResponse {
  InsuranceClaim claim = 1;
}

message AdminListInsuranceClaimsRequest {
  optional string status_filter = 1;
  nomarkup.common.v1.PaginationRequest pagination = 2;
}

message AdminListInsuranceClaimsResponse {
  repeated InsuranceClaim claims = 1;
  nomarkup.common.v1.PaginationResponse pagination = 2;
}
