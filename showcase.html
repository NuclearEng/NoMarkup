<script>
document.getElementById('toggle').onclick=function(){
var pw=document.getElementById('pw');
var off=document.getElementById('eye-off');
var on=document.getElementById('eye-on');
if(pw.type==='password'){pw.type='text';off.style.display='none';on.style.display='block'}
else{pw.type='password';off.style.display='block';on.style.display='none'}
pw.focus();
};
document.getElementById('f').onsubmit=async function(e){
e.preventDefault();
var pw=document.getElementById('pw').value;
var b64=document.getElementById('payload').textContent;
var buf=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)});
var salt=buf.slice(0,16);
var iv=buf.slice(16,28);
var tag=buf.slice(28,44);
var data=buf.slice(44);
try{
var keyMaterial=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);
var combined=new Uint8Array(data.length+tag.length);
combined.set(data);combined.set(tag,data.length);
var dec=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv,tagLength:128},key,combined);
var html=new TextDecoder().decode(dec);
document.open();document.write(html);document.close();
}catch(err){document.getElementById('err').style.display='block'}
};
</script>
