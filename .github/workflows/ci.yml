name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: 22

jobs:
  # ── Frontend ──────────────────────────────────────────────────

  web-lint-typecheck:
    name: Web Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm run typecheck

  web-test:
    name: Web Tests
    needs: web-lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      # Honest coverage gate. Thresholds + `coverage.all` live in
      # web/vitest.config.mts so the % reflects the WHOLE app, not just
      # test-touched files (the old inline 93% override measured only touched
      # files and was misleading). Target is 80% per CLAUDE.md; the config floors
      # are the current real floor and must RATCHET UP, never down — see TODOS-27.
      - run: cd web && npm run test -- --coverage

  e2e-test:
    name: Playwright E2E Tests
    needs: [web-lint-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      # Run ONLY the project whose browser + system deps the step above
      # installs. The bare `playwright test` also ran webkit/firefox with no
      # deps installed — webkit failed on every API-dependent spec (and there
      # is no backend stack in this job; the specs are written backend-tolerant
      # and chromium passes 68/68). Cross-browser E2E stays available locally
      # via `npx playwright test`.
      - name: Run E2E tests
        working-directory: web
        run: npx playwright test --project=chromium

  # ── Proto Drift Guard ─────────────────────────────────────────
  # Ensures generated proto code matches the .proto sources. A broken or
  # drifted .proto would otherwise hide behind hand-written stand-in files
  # (audit S8): the Stripe webhook regression on this branch went unnoticed
  # for weeks because of exactly this failure mode.

  verify-proto:
    name: Verify Proto Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install protoc + plugins
        run: |
          PROTOC_VERSION=34.1
          curl -sSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          # Pin codegen plugins to the versions that produced the committed
          # proto/gen stubs (headers: protoc-gen-go v1.36.11, grpc v1.6.1) so the
          # drift check is deterministic — @latest had bumped grpc to 1.6.2.
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
      - run: make verify-proto

  # ── Go Gateway ────────────────────────────────────────────────

  gateway-test:
    name: Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gateway/go.sum
      - run: cd gateway && go vet ./...
      - run: cd gateway && go test ./... -race -coverprofile=coverage.out

  # ── Go Microservices (matrix) ─────────────────────────────────

  services-test:
    name: Service Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user, job, payment, chat, notification]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - run: cd services/${{ matrix.service }} && go vet ./...
      - run: cd services/${{ matrix.service }} && go test ./... -race

  # ── Rust Engines ──────────────────────────────────────────────

  engines-test:
    name: Rust Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # SHA-pinned: the toolchain can no longer come from the ref name
      # (@stable), so it MUST be passed via the `toolchain` input (required at v1).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engines
      # The engines' build.rs uses prost-build, which shells out to protoc at
      # compile time — clippy/test fail with "Could not find protoc" without it.
      - name: Install protoc
        run: |
          PROTOC_VERSION=34.1
          curl -sSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
      - run: cd engines && cargo fmt --all -- --check
      - run: cd engines && cargo clippy --all-targets -- -D warnings
      - run: cd engines && cargo test --all

  # ── Build & Docker Images ────────────────────────────────────

  build:
    name: Build All
    needs: [web-test, e2e-test, gateway-test, services-test, engines-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # ── Build verification (non-Docker) ──
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # setup-go caches by default (since v4); without a path it looks for a
          # repo-root go.sum that doesn't exist in this monorepo.
          cache-dependency-path: gateway/go.sum
      - run: cd gateway && go build ./cmd/server

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engines
      # Same as engines-test: prost build.rs needs protoc at compile time.
      - name: Install protoc
        run: |
          PROTOC_VERSION=34.1
          curl -sSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
      - run: cd engines && cargo build --release

      # ── Docker image builds ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # The Rust engines share ONE multi-target Dockerfile (engines.Dockerfile,
      # third field = build target) — per-engine Dockerfiles do not exist.
      - name: Build Docker images (PR — no push)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          images=(
            "web:deploy/docker/web.Dockerfile:"
            "gateway:deploy/docker/gateway.Dockerfile:"
            "user:deploy/docker/user.Dockerfile:"
            "job:deploy/docker/job.Dockerfile:"
            "payment:deploy/docker/payment.Dockerfile:"
            "chat:deploy/docker/chat.Dockerfile:"
            "notification:deploy/docker/notification.Dockerfile:"
            "bidding:deploy/docker/engines.Dockerfile:bidding"
            "fraud:deploy/docker/engines.Dockerfile:fraud"
            "trust:deploy/docker/engines.Dockerfile:trust"
            "imaging:deploy/docker/engines.Dockerfile:imaging"
            "underwriting:deploy/docker/engines.Dockerfile:underwriting"
            "pricing:deploy/docker/engines.Dockerfile:pricing"
          )
          for entry in "${images[@]}"; do
            name="${entry%%:*}"
            rest="${entry#*:}"
            dockerfile="${rest%%:*}"
            target="${rest#*:}"
            args=(-f "${dockerfile}" -t "nomarkup/${name}:ci")
            if [ -n "${target}" ]; then args+=(--target "${target}"); fi
            echo "::group::Building nomarkup/${name}"
            docker build "${args[@]}" .
            echo "::endgroup::"
          done

      - name: Build & push Docker images (main — push to registry)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
          IMAGE_PREFIX: ${{ github.repository }}
        run: |
          set -euo pipefail
          images=(
            "web:deploy/docker/web.Dockerfile:"
            "gateway:deploy/docker/gateway.Dockerfile:"
            "user:deploy/docker/user.Dockerfile:"
            "job:deploy/docker/job.Dockerfile:"
            "payment:deploy/docker/payment.Dockerfile:"
            "chat:deploy/docker/chat.Dockerfile:"
            "notification:deploy/docker/notification.Dockerfile:"
            "bidding:deploy/docker/engines.Dockerfile:bidding"
            "fraud:deploy/docker/engines.Dockerfile:fraud"
            "trust:deploy/docker/engines.Dockerfile:trust"
            "imaging:deploy/docker/engines.Dockerfile:imaging"
            "underwriting:deploy/docker/engines.Dockerfile:underwriting"
            "pricing:deploy/docker/engines.Dockerfile:pricing"
          )
          for entry in "${images[@]}"; do
            name="${entry%%:*}"
            rest="${entry#*:}"
            dockerfile="${rest%%:*}"
            target="${rest#*:}"
            tag="${REGISTRY}/${IMAGE_PREFIX}/${name}:${GITHUB_SHA::8}"
            args=(-f "${dockerfile}" -t "${tag}")
            if [ -n "${target}" ]; then args+=(--target "${target}"); fi
            echo "::group::Building and tagging ${tag}"
            docker build "${args[@]}" .
            echo "Built ${tag} — push step requires docker login (configure DOCKER_REGISTRY secret)"
            echo "::endgroup::"
          done
