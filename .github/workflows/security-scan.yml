name: Security Scan

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 6am UTC — catches new CVEs even without code changes
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the exact patch matching every go.mod's `toolchain go1.25.11`: setup-go
  # v6 makes the installed version authoritative (ignores the directive), and a
  # bare "1.25" resolved to 1.25.10, whose stdlib carries vulns fixed in .11.
  # Bump this in lockstep with the toolchain directive.
  GO_VERSION: "1.25.11"
  NODE_VERSION: 22

jobs:
  # ── Go Vulnerability Check ──────────────────────────────────
  go-vuln:
    name: Go Vulncheck (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - gateway
          - services/user
          - services/job
          - services/payment
          - services/chat
          - services/notification
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        working-directory: ${{ matrix.dir }}
        run: govulncheck ./...

  # ── Rust Security Audit ─────────────────────────────────────
  rust-audit:
    name: Rust Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # SHA-pinned: toolchain can't come from the ref name, pass it explicitly.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: engines
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        working-directory: engines
        run: cargo audit

  # ── npm Audit ───────────────────────────────────────────────
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run npm audit (production dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
