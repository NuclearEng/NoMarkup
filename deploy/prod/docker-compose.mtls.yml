# mTLS overlay for deploy/prod/docker-compose.yml — arms gRPC mutual TLS on
# every mesh hop (gateway → services → engines).
#
#   deploy/prod/gen-mtls-certs.sh            # once; creates deploy/prod/mtls/
#   docker compose -f deploy/prod/docker-compose.yml \
#                  -f deploy/prod/docker-compose.mtls.yml \
#                  --env-file deploy/prod/.env up -d
#   # or: MTLS=1 ./scripts/prod/deploy.sh
#
# Kept as an overlay so the base prod file (and dev compose) still boot without
# certs. pkg/grpmtls and engines/telemetry fail closed: GRPC_MTLS=true with a
# missing/unreadable cert stops the process instead of falling back to
# plaintext. Healthchecks use the HTTP observability ports, so they are
# unaffected. Optional per-service caller allowlists: set
# MESH_PEER_ALLOWLIST_<SVC> in .env (e.g. MESH_PEER_ALLOWLIST_PAYMENT=gateway,job,user).
# See deploy/prod/MTLS.md.

x-mtls-env: &mtls-env
  GRPC_MTLS: "true"
  GRPC_TLS_CERT_FILE: /mtls/tls.crt
  GRPC_TLS_KEY_FILE: /mtls/tls.key
  GRPC_TLS_CA_FILE: /mtls/ca.crt
  GRPC_TLS_SERVER_NAME: nomarkup-mesh

services:
  gateway:
    environment:
      <<: *mtls-env
      GRPC_MTLS_SERVICE_NAME: gateway
      MESH_PEER_ALLOWLIST: ${MESH_PEER_ALLOWLIST_GATEWAY:-}
    volumes:
      - ${MTLS_CERTS_DIR:-./mtls}/gateway:/mtls:ro
  user:
    environment:
      <<: *mtls-env
      GRPC_MTLS_SERVICE_NAME: user
      MESH_PEER_ALLOWLIST: ${MESH_PEER_ALLOWLIST_USER:-}
    volumes:
      - ${MTLS_CERTS_DIR:-./mtls}/user:/mtls:ro
  job:
