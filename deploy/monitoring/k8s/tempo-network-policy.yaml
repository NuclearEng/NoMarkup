# Restrict Tempo OTLP + query ports. Once any Ingress NetworkPolicy selects the
# pod, only listed sources are admitted (CNI-dependent).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tempo-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: nomarkup
    nomarkup.com/ops: "OPS-09"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes:
    - Ingress
  ingress:
    # OTel collector dual-export (nomarkup + staging namespaces).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nomarkup
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nomarkup-staging
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # Grafana Explore (same namespace) + health/query API.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 3200
    # In-namespace tooling / port-forward convenience (query API).
    # OTLP remains restricted to the collector selectors above.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3200
