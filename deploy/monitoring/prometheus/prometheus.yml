# NoMarkup Prometheus Configuration
#
# In-cluster: kubectl apply -k deploy/monitoring  (OPS-10; see
# docs/operations/monitoring-stack.md). ConfigMap-mounted next to alerts.yml;
# bearer file from Secret nomarkup-metrics-token.
# Local dev: docker-compose mounts this file + alerts.yml +
# dev-metrics-bearer-token → /etc/prometheus/secrets/metrics-bearer-token.
# kubernetes_sd jobs are inert without a cluster API; self-scrape still works.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    cluster: nomarkup
    environment: production

# Alerting configuration — forward alerts to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      # In K8s, use service discovery instead:
      # kubernetes_sd_configs:
      #   - role: pod
      #     namespaces:
      #       names: [monitoring]
      # relabel_configs:
      #   - source_labels: [__meta_kubernetes_pod_label_app]
      #     regex: alertmanager
      #     action: keep

# Load alerting and recording rules
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # -------------------------------------------------------------------------
  # Prometheus self-monitoring
  # -------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # -------------------------------------------------------------------------
  # Kubernetes service discovery — pods with prometheus.io annotations
  # -------------------------------------------------------------------------
  # Discovers all pods annotated with:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port: "<port>"       (optional, defaults to container port)
  #   prometheus.io/path: "<path>"       (optional, defaults to /metrics)
  - job_name: kubernetes-pods
    # The gateway gates /metrics behind a bearer token (SEC-08 protectMetrics,
    # gateway/internal/router/router.go): in production, a non-loopback request
    # with no Authorization header gets 401. Without this stanza every scrape of
    # the gateway was rejected, so http_requests_total /
    # http_request_duration_seconds never existed and every alert derived from
    # them — including the P0 NoMarkupPaymentFailureSpike and
    # NoMarkupPaymentPathDown — could never fire.
    #
    # `credentials_file` must contain the SAME value as the METRICS_BEARER_TOKEN
    # key of the `nomarkup-secrets` Secret (see deploy/k8s/SECRETS.md). Mount it
    # into the Prometheus pod, e.g.:
    #
    #   volumes:
    #     - name: metrics-token
    #       secret:
    #         secretName: nomarkup-metrics-token   # in the `monitoring` namespace
    #         items: [{ key: METRICS_BEARER_TOKEN, path: metrics-bearer-token }]
    #         defaultMode: 0400
    #   volumeMounts:
    #     - name: metrics-token
    #       mountPath: /etc/prometheus/secrets
    #       readOnly: true
    #
    # Targets that do not check the header (Go service /metrics ports, Rust
    # engines) simply ignore it — sending it job-wide is safe.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-bearer-token
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - nomarkup
    relabel_configs:
      # Only scrape pods with prometheus.io/scrape=true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"

      # Use custom metrics path if specified
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

      # Use custom port if specified
      - source_labels:
          - __address__
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__

      # Attach pod labels as Prometheus labels
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace

      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: replace
        target_label: service

      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        action: replace
        target_label: component

  # -------------------------------------------------------------------------
  # Kubernetes nodes (kubelet + cAdvisor)
  # -------------------------------------------------------------------------
  - job_name: kubernetes-nodes
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics

  - job_name: kubernetes-cadvisor
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

  # -------------------------------------------------------------------------
  # kube-state-metrics — deployment replicas, pod status, restart counts
  # -------------------------------------------------------------------------
  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics:8080

  # -------------------------------------------------------------------------
  # Local development — static targets (used in docker-compose)
  # -------------------------------------------------------------------------
  # Uncomment these and comment out kubernetes_sd_configs for local dev.
  #
  # - job_name: gateway
  #   static_configs:
  #     - targets: ["gateway:8080"]
  #       labels:
  #         service: gateway
  #         component: gateway
  #
  # - job_name: pgbouncer
  #   static_configs:
  #     - targets: ["pgbouncer-exporter:9127"]
  #       labels:
  #         service: pgbouncer

  # -------------------------------------------------------------------------
  # Database exporters — NOT DEPLOYED
  # -------------------------------------------------------------------------
  # There is no pgbouncer / pgbouncer-exporter / postgres_exporter workload in
  # deploy/k8s (pgbouncer exists only in docker-compose.yml for local dev, and
  # Go services connect to Postgres directly via DATABASE_URL). The two alert
  # rules that consumed those series — NoMarkupDBConnectionPoolExhausted
  # (pgbouncer_pools_server_*) and NoMarkupDBSlowQueries
  # (pg_stat_activity_max_tx_duration) — are therefore COMMENTED OUT in
  # alerts.yml rather than left as permanently-silent rules that read as
  # coverage. To re-enable: deploy the exporters, add scrape jobs here, then
  # uncomment the matching block in alerts.yml (`nomarkup.database`).
