# Grafana Tempo single-binary (lite) — OPS-09 optional in-cluster backend.
# Local filesystem storage only (emptyDir). Not HA; staging / smoke only.
# OTLP receivers bind all interfaces so the Service can forward from the mesh.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Short retention: emptyDir + lite footprint. Raise only with a PVC.
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# No metrics_generator remote_write — keeps this lite stack independent of
# Prometheus remote-write being enabled. Traces are still queryable via
# Grafana Explore (Tempo datasource → http://tempo:3200).

usage_report:
  reporting_enabled: false
