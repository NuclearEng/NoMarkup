apiVersion: 1

providers:
  - name: NoMarkup
    orgId: 1
    folder: NoMarkup
    folderUid: nomarkup
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # ConfigMap-mounted dashboards (k8s) or bind-mount (local).
      # Writable grafana data stays on /var/lib/grafana (emptyDir in k8s).
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
