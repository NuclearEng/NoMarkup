# Grafana datasource provisioning — Prometheus in the same monitoring namespace.
# Mounted at /etc/grafana/provisioning/datasources/datasources.yaml
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    uid: prometheus
    jsonData:
      timeInterval: 15s
      httpMethod: POST
