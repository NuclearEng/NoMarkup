apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: nomarkup
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: nomarkup
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/nomarkup/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_PORT
              value: "8080"
            # RS256 verification key. The code reads a FILE PATH, not the PEM
            # itself, so the key is projected from nomarkup-secrets as a file
            # by the jwt-keys volume below. Documented as a Secret *value* in
            # SECRETS.md previously, which meant the gateway would exit 1 at
            # startup because the path was never set and the file never existed.
            - name: JWT_PUBLIC_KEY_PATH
              value: "/etc/nomarkup/jwt/public.pem"
            - name: USER_SERVICE_ADDR
              value: "user:50051"
            - name: JOB_SERVICE_ADDR
              value: "job:50052"
            - name: BID_ENGINE_ADDR
              value: "bidding:50053"
            - name: PAYMENT_SERVICE_ADDR
              value: "payment:50054"
            - name: CHAT_SERVICE_ADDR
              value: "chat:50055"
            - name: CHAT_WS_ADDR
              value: "chat:50065"
            - name: FRAUD_ENGINE_ADDR
              value: "fraud:50056"
            - name: TRUST_ENGINE_ADDR
              value: "trust:50057"
            - name: IMAGING_SERVICE_ADDR
              value: "imaging:50058"
            - name: NOTIFICATION_SERVICE_ADDR
              value: "notification:50059"
            # Shared hop-auth secret with chat (also in nomarkup-secrets via envFrom).
            - name: INTERNAL_WS_SECRET
              valueFrom:
                secretKeyRef:
                  name: nomarkup-secrets
                  key: INTERNAL_WS_SECRET
            # Prometheus /metrics bearer token (SEC-08, protectMetrics in
            # gateway/internal/router/router.go). In production, with no token
            # set and METRICS_PUBLIC unset, ANY non-loopback request to /metrics
            # gets 401 — which meant the cross-pod Prometheus scrape was being
            # rejected and every http_requests_total / http_request_duration_seconds
            # alert (both P0 payment alerts included) was permanently dark.
            # Prometheus sends the identical value via `authorization:` on the
            # kubernetes-pods job (deploy/monitoring/prometheus/prometheus.yml).
            # Deliberately NOT `optional: true`: the pod must fail to start rather
            # than boot with metrics silently unscrapeable. Never set
            # METRICS_PUBLIC=true — that exposes /metrics unauthenticated.
            - name: METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nomarkup-secrets
                  key: METRICS_BEARER_TOKEN
            # Category-tree cache key + Sentry release; set in nomarkup-config (overlay).
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: nomarkup-config
                  key: APP_VERSION
                  optional: true
            # OPS-25 — optional in-process Vault client (gateway/internal/vault).
            # All keys optional: when unset, vault.New is a no-op and GetString
            # falls through to envFrom nomarkup-secrets (ESO primary path, OPS-04).
            # Founder wires live values in Vault → nomarkup-secrets or sets these
            # keys directly. Prefer AppRole (ROLE_ID + SECRET_ID) over VAULT_TOKEN.
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: nomarkup-secrets
                  key: VAULT_ADDR
                  optional: true
            - name: VAULT_NAMESPACE
              valueFrom:
                secretKeyRef:
                  name: nomarkup-secrets
                  key: VAULT_NAMESPACE
                  optional: true
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: nomarkup-secrets
                  key: VAULT_ROLE_ID
                  optional: true
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: nomarkup-secrets
                  key: VAULT_SECRET_ID
                  optional: true
          envFrom:
            - configMapRef:
                name: nomarkup-config
            - secretRef:
                name: nomarkup-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Liveness MUST stay dependency-INDEPENDENT. `/health` (healthHandler,
          # gateway/internal/router/router.go) is an unconditional 200 — that is
          # deliberate: a Postgres/Redis blip must never restart every gateway
          # pod at once (restart storm). Only a wedged process fails this.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness MUST be dependency-CHECKING. `/readyz` (readinessHandler)
          # pings Postgres + Redis with a 1s deadline and returns 503 when either
          # is unreachable, so the pod is pulled from Service endpoints instead of
          # serving 500s. Previously this pointed at `/health`, which meant a pod
          # with both datastores dead still advertised itself as ready.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/nomarkup/jwt
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        # Projects the RS256 keypair out of nomarkup-secrets as files. Only the
        # public key is projected here — the gateway verifies tokens and must
        # never hold the signing key.
        - name: jwt-keys
          secret:
            secretName: nomarkup-secrets
            defaultMode: 0400
            items:
              - key: JWT_PUBLIC_KEY
                path: public.pem
