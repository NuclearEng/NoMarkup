# SAMPLE — External Secrets Operator (ESO) → Vault → Kubernetes Secrets
#
# This file is NOT applied by kustomization.yaml (filename ends in .sample.yaml).
# Copy pieces you need into overlays/production/ (or manage via your secrets
# platform) only after Vault + a ClusterSecretStore exist.
#
# OPS-04 Founder-Action residual: in-repo pattern only. Founder still wires
# real Vault, the ClusterSecretStore auth, and stores live values. Do NOT
# invent secrets or commit real credentials into this tree.
#
# Full key list + rotation: deploy/k8s/SECRETS.md
# Manual one-shot fallback (dev only):
#   kubectl create secret generic nomarkup-secrets -n nomarkup \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-literal=METRICS_BEARER_TOKEN="$(openssl rand -base64 32)" \
#     ...
#
# Prerequisites (Founder):
#   1. Vault KV v2 mount with path nomarkup/data/production (or edit remoteRefs)
#   2. ESO installed in the cluster
#   3. ClusterSecretStore `vault-backend` (sample at bottom of this file)
#   4. Every property listed under "Vault property map" present before first apply
---
# ---------------------------------------------------------------------------
# ExternalSecret → Secret `nomarkup-secrets` (namespace nomarkup)
#
# Prefer explicit `data:` for money / auth / scrape-critical keys so the Vault
# property → K8s key mapping is reviewable. Optional bulk `dataFrom` can cover
# the long tail (S3, Twilio, …) once the store is live.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nomarkup-secrets
  namespace: nomarkup
  labels:
    app.kubernetes.io/name: nomarkup-secrets
    app.kubernetes.io/part-of: nomarkup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nomarkup-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: nomarkup-secrets
          app.kubernetes.io/part-of: nomarkup
  # Explicit remoteRefs for the four OPS-04 spotlight families.
  # remoteRef.key = Vault KV path (without the mount prefix if your store sets it).
  # remoteRef.property = field name inside that KV object (must match env key names
  # consumed by Deployments — do not rename without updating volumeMounts / secretKeyRef).
  data:
    # --- METRICS (SEC-08) — gateway protectMetrics; MUST match monitoring Secret ---
    - secretKey: METRICS_BEARER_TOKEN
      remoteRef:
        key: nomarkup/production
        property: METRICS_BEARER_TOKEN

    # --- JWT (RS256) — PEM *content* in the Secret; mounted as files (not env) ---
    # gateway: volume key JWT_PUBLIC_KEY → /etc/nomarkup/jwt/public.pem
    # user:    JWT_PRIVATE_KEY + JWT_PUBLIC_KEY → private.pem + public.pem
    # See SECRETS.md "RS256 keys are consumed as FILES".
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: nomarkup/production
        property: JWT_PRIVATE_KEY
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: nomarkup/production
        property: JWT_PUBLIC_KEY

    # --- STRIPE (payment service; never client-side) ---
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: nomarkup/production
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: nomarkup/production
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: STRIPE_CONNECT_CLIENT_ID
      remoteRef:
        key: nomarkup/production
        property: STRIPE_CONNECT_CLIENT_ID

    # --- GOOGLE OAuth (gateway; not ConfigMap — OPS-08) ---
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: nomarkup/production
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: nomarkup/production
        property: GOOGLE_CLIENT_SECRET

    # --- Always-required platform keys (non-exhaustive; full table in SECRETS.md) ---
    - secretKey: DATABASE_URL
      remoteRef:
        key: nomarkup/production
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: nomarkup/production
        property: REDIS_URL
    - secretKey: SESSION_SECRET
      remoteRef:
        key: nomarkup/production
        property: SESSION_SECRET
    - secretKey: INTERNAL_WS_SECRET
      remoteRef:
        key: nomarkup/production
        property: INTERNAL_WS_SECRET
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: nomarkup/production
        property: ENCRYPTION_KEY
    - secretKey: MEILISEARCH_API_KEY
      remoteRef:
        key: nomarkup/production
        property: MEILISEARCH_API_KEY

  # Optional bulk extract for remaining keys (S3_*, SENDGRID_*, TWILIO_*, …).
  # Uncomment only when every property under the Vault path is intentional —
  # extract merges all fields into the target Secret.
  # dataFrom:
  #   - extract:
  #       key: nomarkup/production
---
# ---------------------------------------------------------------------------
# ExternalSecret → Secret `nomarkup-metrics-token` (namespace monitoring)
#
# Prometheus scrapes gateway /metrics with Authorization: Bearer <token>.
# Same plaintext value as nomarkup-secrets/METRICS_BEARER_TOKEN, second Secret
# in the monitoring namespace (see SECRETS.md + docs/operations/monitoring-stack.md).
# Rotate both together or alerts go dark without a scrape-failure page.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nomarkup-metrics-token
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nomarkup-metrics-token
    app.kubernetes.io/part-of: nomarkup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nomarkup-metrics-token
    creationPolicy: Owner
    template:
      type: Opaque
      # Prometheus Deployment mounts this key as a file:
      #   secretKey METRICS_BEARER_TOKEN → /etc/prometheus/secrets/metrics-bearer-token
      # Keep the secretKey name identical to the app-side key for operator clarity.
      metadata:
        labels:
          app.kubernetes.io/name: nomarkup-metrics-token
          app.kubernetes.io/part-of: nomarkup
  data:
    - secretKey: METRICS_BEARER_TOKEN
      remoteRef:
        key: nomarkup/production
        property: METRICS_BEARER_TOKEN
---
# ---------------------------------------------------------------------------
# SAMPLE ClusterSecretStore — Vault backend (NOT live; Founder fills auth)
#
# Install ESO first. Auth method, role, and server URL are environment-
# specific — replace every REPLACE_WITH_* below. Never commit real tokens.
# ---------------------------------------------------------------------------
# apiVersion: external-secrets.io/v1beta1
# kind: ClusterSecretStore
# metadata:
#   name: vault-backend
# spec:
#   provider:
#     vault:
#       server: "https://REPLACE_WITH_VAULT_ADDR"
#       path: "secret"          # KV mount path
#       version: "v2"
#       auth:
#         # Prefer Kubernetes auth (no long-lived token in the CR):
#         kubernetes:
#           mountPath: "kubernetes"
#           role: "nomarkup-eso"
#           serviceAccountRef:
#             name: "external-secrets"
#             namespace: "external-secrets"
#         # OR token auth for break-glass only (store token in a bootstrap Secret):
#         # tokenSecretRef:
#         #   name: "vault-token"
#         #   key: "token"
#         #   namespace: "external-secrets"
---
# Vault property map (Founder creates these under nomarkup/production).
# Values are never committed — generate / obtain out-of-band.
#
# Spotlight families (OPS-04):
#
#   METRICS_BEARER_TOKEN       openssl rand -base64 32
#                             → also mirrored to monitoring/nomarkup-metrics-token
#
#   JWT_PRIVATE_KEY           PEM PKCS#8 RSA private (user service file mount)
#   JWT_PUBLIC_KEY            PEM public (gateway + user file mounts)
#                             openssl genrsa 4096 | …  (see docs/secrets-rotation.md)
#
#   STRIPE_SECRET_KEY         sk_live_… from Stripe Dashboard (server only)
#   STRIPE_WEBHOOK_SECRET     whsec_… endpoint signing secret
#   STRIPE_CONNECT_CLIENT_ID  ca_… Connect platform client id
#
#   GOOGLE_CLIENT_ID          ….apps.googleusercontent.com (OAuth aud)
#   GOOGLE_CLIENT_SECRET      confidential client secret (never ConfigMap)
#
# Always-required (also map via explicit data: or dataFrom extract):
#
#   DATABASE_URL
#   REDIS_URL
#   SESSION_SECRET
#   INTERNAL_WS_SECRET
#   ENCRYPTION_KEY              # base64 32-byte; required staging+prod
#   MEILISEARCH_API_KEY
#   S3_ACCESS_KEY_ID
#   S3_SECRET_ACCESS_KEY
#   SENDGRID_API_KEY
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM_NUMBER
#   SENTRY_DSN
#   NEXT_PUBLIC_SENTRY_DSN
#   APPLE_CLIENT_SECRET
#
# Apply after store exists:
#   cp deploy/k8s/base/externalsecret.sample.yaml \
#      deploy/k8s/overlays/production/externalsecret.yaml
#   # strip the commented ClusterSecretStore if applied separately
#   kubectl apply -f deploy/k8s/overlays/production/externalsecret.yaml
#   kubectl get externalsecret -n nomarkup
#   kubectl get secret nomarkup-secrets -n nomarkup
#   kubectl get secret nomarkup-metrics-token -n monitoring
#
# Force resync after Vault rotation:
#   kubectl annotate externalsecret nomarkup-secrets force-sync=$(date +%s) \
#     -n nomarkup --overwrite
#   kubectl annotate externalsecret nomarkup-metrics-token force-sync=$(date +%s) \
#     -n monitoring --overwrite
#   kubectl rollout restart deployment -n nomarkup -l app.kubernetes.io/part-of=nomarkup
#   kubectl -n monitoring rollout restart deploy/prometheus
