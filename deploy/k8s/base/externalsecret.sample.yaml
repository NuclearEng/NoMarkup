# SAMPLE — External Secrets Operator → Vault → nomarkup-secrets
#
# This file is NOT applied by kustomization.yaml (filename ends in .sample.yaml).
# Copy to overlays/production/externalsecret.yaml (or manage via your secrets
# platform) after ClusterSecretStore `vault-backend` exists.
#
# Full key list + rotation: deploy/k8s/SECRETS.md
# Manual one-shot fallback:
#   kubectl create secret generic nomarkup-secrets -n nomarkup \
#     --from-literal=DATABASE_URL='postgres://...' \
#     --from-literal=INTERNAL_WS_SECRET="$(openssl rand -base64 32)" \
#     ...
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nomarkup-secrets
  namespace: nomarkup
  labels:
    app.kubernetes.io/name: nomarkup-secrets
    app.kubernetes.io/part-of: nomarkup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nomarkup-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: nomarkup-secrets
          app.kubernetes.io/part-of: nomarkup
  dataFrom:
    - extract:
        # Vault KV path holding all keys listed in SECRETS.md plus:
        #   INTERNAL_WS_SECRET  — shared gateway↔chat WebSocket hop auth
        key: nomarkup/production
---
# Optional: document required keys for operators (not consumed by ESO).
# Create these in Vault at nomarkup/production before the first deploy:
#
#   DATABASE_URL
#   REDIS_URL
#   JWT_PRIVATE_KEY
#   JWT_PUBLIC_KEY
#   SESSION_SECRET
#   INTERNAL_WS_SECRET          # openssl rand -base64 32 — same on gateway + chat
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_CONNECT_CLIENT_ID
#   S3_ACCESS_KEY_ID
#   S3_SECRET_ACCESS_KEY
#   MEILISEARCH_API_KEY
#   SENDGRID_API_KEY
#   TWILIO_ACCOUNT_SID
#   TWILIO_AUTH_TOKEN
#   TWILIO_FROM_NUMBER
#   SENTRY_DSN
#   NEXT_PUBLIC_SENTRY_DSN
#   GOOGLE_CLIENT_SECRET
#   APPLE_CLIENT_SECRET
#   ENCRYPTION_KEY              # base64 32-byte AES key for PII at rest
