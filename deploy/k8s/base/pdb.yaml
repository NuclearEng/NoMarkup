# PodDisruptionBudgets — keep at least one pod during voluntary disruptions
# (node drains, cluster upgrades). Only multi-replica Deployments are listed;
# meilisearch (RWO PVC, 1 replica) and otel-collector (1 replica) are omitted.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: nomarkup
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: nomarkup
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
