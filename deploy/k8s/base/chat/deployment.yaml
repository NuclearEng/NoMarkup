apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/component: go-service
    app.kubernetes.io/part-of: nomarkup
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat
        app.kubernetes.io/component: go-service
        app.kubernetes.io/part-of: nomarkup
      annotations:
        # Go services: metrics on SERVICE_PORT+1000 (see docs/operations/metrics.md)
        prometheus.io/scrape: "true"
        prometheus.io/port: "51055"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chat
          image: ghcr.io/nomarkup/chat:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50055
              protocol: TCP
            - name: ws
              containerPort: 50065
              protocol: TCP
            - name: metrics
              containerPort: 51055
              protocol: TCP
          env:
            - name: CHAT_SERVICE_PORT
              value: "50055"
            - name: CHAT_WS_PORT
              value: "50065"
            - name: METRICS_PORT
              value: "51055"
            - name: INTERNAL_WS_SECRET
              valueFrom:
                secretKeyRef:
                  name: nomarkup-secrets
                  key: INTERNAL_WS_SECRET
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: nomarkup-config
                  key: APP_VERSION
                  optional: true
          envFrom:
            - configMapRef:
                name: nomarkup-config
            - secretRef:
                name: nomarkup-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Observability HTTP on SERVICE_PORT+1000 (docs/operations/metrics.md).
          # gRPC health is SERVING-at-boot only; /readyz fails when Postgres/Redis down.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
