apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nomarkup
data:
  config.yaml: |
    # OTLP pipeline: receive -> batch -> dual export (debug + OTLP/HTTP).
    #
    # App pods send to this collector via OTEL_EXPORTER_OTLP_ENDPOINT
    # (http://otel-collector:4317). The collector then dual-exports:
    #   - debug: always on (pod logs / kubectl logs) — safe default
    #   - otlphttp/backend: OTLP/HTTP to a Tempo / Jaeger / vendor URL
    #
    # Backend URL is env-expanded from OTEL_BACKEND_OTLP_HTTP_ENDPOINT
    # (see backend-configmap.yaml + deployment env). Default is loopback so
    # the collector starts without a real backend; export errors to
    # 127.0.0.1 are expected until an operator sets a real endpoint.
    # No SaaS credentials are baked in — see docs/operations/otel-collector.md.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 512
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100

    exporters:
      debug:
        verbosity: basic
      # Named instance so a future second backend can be added without clashing.
      otlphttp/backend:
        # Tempo, Jaeger (OTLP), Grafana Cloud OTLP gateway, Honeycomb, etc.
        # HTTP (4318) not gRPC — matches most managed OTLP HTTP gateways.
        endpoint: ${env:OTEL_BACKEND_OTLP_HTTP_ENDPOINT:-http://127.0.0.1:4318}
        compression: gzip
        timeout: 10s
        tls:
          # true for plain http:// in-cluster Tempo/Jaeger; set false for
          # https:// vendor endpoints (see backend ConfigMap).
          insecure: ${env:OTEL_BACKEND_OTLP_TLS_INSECURE:-true}
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 60s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 512

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, otlphttp/backend]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, otlphttp/backend]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug, otlphttp/backend]
