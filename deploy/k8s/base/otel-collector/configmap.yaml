apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nomarkup
data:
  config.yaml: |
    # Minimal OTLP pipeline: receive -> batch -> export.
    #
    # NOTE: deploy/monitoring has Prometheus + Grafana configs but no
    # existing collector exporter config to inherit, so this ships with the
    # `debug` exporter (summary verbosity) as a safe default. Swap/add a real
    # backend exporter (e.g. `otlp` to a vendor endpoint, or `jaeger` —
    # docker-compose uses jaegertracing/all-in-one locally) before relying
    # on traces in production.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 512
        timeout: 5s

    exporters:
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
