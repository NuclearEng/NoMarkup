apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-backend
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nomarkup
data:
  # Downstream OTLP/HTTP base URL (no path — collector appends /v1/traces etc.).
  # Examples (no credentials; operator supplies real host at deploy time):
  #   Optional Tempo lite (deploy/monitoring): http://tempo.monitoring.svc.cluster.local:4318
  #   Self-hosted HA Tempo:  http://tempo.observability.svc:4318
  #   Self-hosted Jaeger OTLP HTTP:  http://jaeger-collector.observability.svc:4318
  #   Vendor HTTPS (Grafana/Honeycomb/etc.): https://otlp-gateway.example.com
  #
  # Loopback default keeps the collector Ready without a real backend.
  # Staging overlay patches this to Tempo lite (otel-backend-patch.yaml).
  # Export retries to 127.0.0.1 will fail quietly until this is set.
  OTEL_BACKEND_OTLP_HTTP_ENDPOINT: "http://127.0.0.1:4318"
  # "true" for http:// backends; "false" when using https:// vendor endpoints.
  OTEL_BACKEND_OTLP_TLS_INSECURE: "true"
