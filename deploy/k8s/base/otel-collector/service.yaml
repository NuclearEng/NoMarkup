apiVersion: v1
kind: Service
metadata:
  # Name is load-bearing: the per-environment configMapGenerator sets
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 (in-cluster DNS).
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nomarkup
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
