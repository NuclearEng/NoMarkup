apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  labels:
    app.kubernetes.io/name: pricing
    app.kubernetes.io/component: rust-engine
    app.kubernetes.io/part-of: nomarkup
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricing
        app.kubernetes.io/component: rust-engine
        app.kubernetes.io/part-of: nomarkup
      annotations:
        # Rust engines: metrics on gRPC port + 10000 (docs/operations/metrics.md)
        prometheus.io/scrape: "true"
        prometheus.io/port: "60061"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pricing
          image: ghcr.io/nomarkup/pricing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50061
              protocol: TCP
            - name: metrics
              containerPort: 60061
              protocol: TCP
          env:
            - name: PRICING_ENGINE_PORT
              value: "50061"
            - name: PRICING_METRICS_PORT
              value: "60061"
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: nomarkup-config
                  key: APP_VERSION
                  optional: true
          envFrom:
            - configMapRef:
                name: nomarkup-config
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            grpc:
              port: 50061
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50061
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
