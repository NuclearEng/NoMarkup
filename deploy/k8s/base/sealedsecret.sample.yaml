# SAMPLE — Bitnami Sealed Secrets (alternative to ESO when Vault is not ready)
#
# This file is NOT applied by kustomization.yaml (filename ends in .sample.yaml).
# OPS-04 Partial: documents the SealedSecret *pattern* only. It intentionally
# contains **no** encryptedData payloads and **no** plaintext secrets.
#
# Preferred production path remains External Secrets Operator + Vault
# (`externalsecret.sample.yaml`). SealedSecrets are the offline / gitops
# fallback when the cluster has a Sealed Secrets controller but Vault is not
# yet wired.
#
# Full key list: deploy/k8s/SECRETS.md
#
# ---------------------------------------------------------------------------
# Workflow (run on a trusted machine; never paste live values into git)
# ---------------------------------------------------------------------------
#
# 1. Install controller + kubeseal CLI (versions must match the controller).
# 2. Build a plain Secret *locally* (not committed):
#
#    # Generate non-third-party secrets yourself — do not invent Stripe/Google.
#    METRICS_BEARER_TOKEN="$(openssl rand -base64 32)"
#    SESSION_SECRET="$(openssl rand -base64 32)"
#    INTERNAL_WS_SECRET="$(openssl rand -base64 32)"
#    ENCRYPTION_KEY="$(openssl rand -base64 32)"
#    # JWT PEMs: follow docs/secrets-rotation.md (private stays user-service only)
#    # STRIPE_*: copy from Stripe Dashboard (live keys never in chat/logs)
#    # GOOGLE_*: copy from Google Cloud Console OAuth client
#
#    kubectl create secret generic nomarkup-secrets \
#      --namespace=nomarkup \
#      --from-literal=METRICS_BEARER_TOKEN="$METRICS_BEARER_TOKEN" \
#      --from-literal=JWT_PRIVATE_KEY="$(cat jwt-private.pem)" \
#      --from-literal=JWT_PUBLIC_KEY="$(cat jwt-public.pem)" \
#      --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
#      --from-literal=STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
#      --from-literal=STRIPE_CONNECT_CLIENT_ID="$STRIPE_CONNECT_CLIENT_ID" \
#      --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
#      --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
#      --from-literal=DATABASE_URL="$DATABASE_URL" \
#      --from-literal=REDIS_URL="$REDIS_URL" \
#      --from-literal=SESSION_SECRET="$SESSION_SECRET" \
#      --from-literal=INTERNAL_WS_SECRET="$INTERNAL_WS_SECRET" \
#      --from-literal=ENCRYPTION_KEY="$ENCRYPTION_KEY" \
#      --from-literal=MEILISEARCH_API_KEY="$MEILISEARCH_API_KEY" \
#      --dry-run=client -o yaml > /tmp/nomarkup-secrets.plain.yaml
#
# 3. Seal against the cluster public key (ciphertext is cluster-scoped):
#
#    kubeseal --format=yaml \
#      < /tmp/nomarkup-secrets.plain.yaml \
#      > deploy/k8s/overlays/production/sealedsecret-nomarkup-secrets.yaml
#
# 4. Same value for Prometheus (monitoring namespace) — seal a second Secret:
#
#    kubectl create secret generic nomarkup-metrics-token \
#      --namespace=monitoring \
#      --from-literal=METRICS_BEARER_TOKEN="$METRICS_BEARER_TOKEN" \
#      --dry-run=client -o yaml \
#    | kubeseal --format=yaml \
#      > deploy/k8s/overlays/production/sealedsecret-nomarkup-metrics-token.yaml
#
# 5. Commit only the *sealed* YAML (encryptedData). Shred /tmp plain files.
# 6. kubectl apply -f the sealed manifests; controller creates the Secrets.
#
# Verify keys exist (values stay redacted):
#   kubectl get secret nomarkup-secrets -n nomarkup -o jsonpath='{.data}' | jq 'keys'
#   kubectl get secret nomarkup-metrics-token -n monitoring -o jsonpath='{.data}' | jq 'keys'
#
# ---------------------------------------------------------------------------
# Shape reference — DO NOT kubectl apply this sample as-is.
# encryptedData must be produced by kubeseal against your cluster cert.
# Do not invent Ag… ciphertext; empty encryptedData will not decrypt.
#
# Spotlight key names (must match SECRETS.md / Deployment secretKeyRef mounts):
#
#   METRICS_BEARER_TOKEN     # also seal into monitoring/nomarkup-metrics-token
#   JWT_PRIVATE_KEY          # PEM content; file-mounted on user service
#   JWT_PUBLIC_KEY           # PEM content; file-mounted on gateway + user
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_CONNECT_CLIENT_ID
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   (+ DATABASE_URL, REDIS_URL, SESSION_SECRET, INTERNAL_WS_SECRET,
#    ENCRYPTION_KEY, MEILISEARCH_API_KEY, and the rest of SECRETS.md)
# ---------------------------------------------------------------------------
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nomarkup-secrets
  namespace: nomarkup
  labels:
    app.kubernetes.io/name: nomarkup-secrets
    app.kubernetes.io/part-of: nomarkup
  annotations:
    # Keep strict (default): namespace/name cannot be retargeted after sealing.
    sealedsecrets.bitnami.com/namespace-wide: "false"
    # SAMPLE ONLY — replace entire encryptedData via kubeseal before any apply.
    nomarkup.com/sample: "true"
spec:
  template:
    metadata:
      name: nomarkup-secrets
      namespace: nomarkup
      labels:
        app.kubernetes.io/name: nomarkup-secrets
        app.kubernetes.io/part-of: nomarkup
    type: Opaque
  # Intentionally empty. After `kubeseal`, this map holds cluster-encrypted
  # strings for every required key (METRICS_BEARER_TOKEN, JWT_*, STRIPE_*,
  # GOOGLE_*, …). Applying empty encryptedData is a no-op failure mode — always
  # overwrite this file from kubeseal output instead of hand-editing.
  encryptedData: {}
---
# Second SealedSecret for Prometheus. Use the SAME METRICS_BEARER_TOKEN
# plaintext that was sealed into nomarkup-secrets (generate once, seal twice).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nomarkup-metrics-token
  namespace: monitoring
  labels:
    app.kubernetes.io/name: nomarkup-metrics-token
    app.kubernetes.io/part-of: nomarkup
  annotations:
    nomarkup.com/sample: "true"
spec:
  template:
    metadata:
      name: nomarkup-metrics-token
      namespace: monitoring
      labels:
        app.kubernetes.io/name: nomarkup-metrics-token
        app.kubernetes.io/part-of: nomarkup
    type: Opaque
  encryptedData: {}
