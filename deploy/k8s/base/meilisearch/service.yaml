apiVersion: v1
kind: Service
metadata:
  # Name is load-bearing: the per-environment configMapGenerator sets
  # MEILISEARCH_URL=http://meilisearch:7700 (in-cluster DNS).
  name: meilisearch
  labels:
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: nomarkup
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: http
      protocol: TCP
