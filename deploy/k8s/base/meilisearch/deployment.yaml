apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  labels:
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: nomarkup
spec:
  replicas: 1
  # Recreate: meili-data is a ReadWriteOnce PVC — a rolling update would
  # deadlock waiting for the old pod to release the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: nomarkup
    spec:
      containers:
        - name: meilisearch
          # Pinned to the same minor as docker-compose.yml (local dev parity).
          image: getmeili/meilisearch:v1.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          env:
            - name: MEILI_ENV
              value: "production"
            - name: MEILI_NO_ANALYTICS
              value: "true"
            # Same value the gateway/job services authenticate with
            # (MEILISEARCH_API_KEY in `nomarkup-secrets`, see SECRETS.md) —
            # identical to the docker-compose wiring where MEILI_MASTER_KEY
            # and MEILISEARCH_API_KEY share one value.
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: nomarkup-secrets
                  key: MEILISEARCH_API_KEY
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
          livenessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: meili-data
