apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud
  labels:
    app.kubernetes.io/name: fraud
    app.kubernetes.io/component: rust-engine
    app.kubernetes.io/part-of: nomarkup
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud
        app.kubernetes.io/component: rust-engine
        app.kubernetes.io/part-of: nomarkup
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "60056"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fraud
          image: ghcr.io/nomarkup/fraud:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50056
              protocol: TCP
            - name: metrics
              containerPort: 60056
              protocol: TCP
          env:
            - name: FRAUD_ENGINE_PORT
              value: "50056"
            - name: FRAUD_METRICS_PORT
              value: "60056"
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: nomarkup-config
                  key: APP_VERSION
                  optional: true
          envFrom:
            - configMapRef:
                name: nomarkup-config
            - secretRef:
                name: nomarkup-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
