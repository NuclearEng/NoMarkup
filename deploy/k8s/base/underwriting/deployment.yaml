apiVersion: apps/v1
kind: Deployment
metadata:
  name: underwriting
  labels:
    app.kubernetes.io/name: underwriting
    app.kubernetes.io/component: rust-engine
    app.kubernetes.io/part-of: nomarkup
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: underwriting
  template:
    metadata:
      labels:
        app.kubernetes.io/name: underwriting
        app.kubernetes.io/component: rust-engine
        app.kubernetes.io/part-of: nomarkup
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "50060"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: underwriting
          image: ghcr.io/nomarkup/underwriting:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50060
              protocol: TCP
          # Pure-function engine: no DATABASE_URL or secrets needed.
          env:
            - name: UNDERWRITING_ENGINE_PORT
              value: "50060"
          envFrom:
            - configMapRef:
                name: nomarkup-config
          livenessProbe:
            grpc:
              port: 50060
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50060
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
