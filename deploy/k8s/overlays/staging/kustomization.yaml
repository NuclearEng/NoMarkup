apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nomarkup-staging

namePrefix: staging-

resources:
  - ../../base

# Image pinning — staging deploys an explicit tag, never floating `:latest`.
# `v0.1.0` is the placeholder release; CI stamps the real release tag at
# deploy time via `kustomize edit set image ghcr.io/nomarkup/<name>:<tag>`
# (deploy.yml is a gated placeholder today — it no-ops unless the
# DEPLOY_PROVISIONED repo variable is "true").
images:
  - name: ghcr.io/nomarkup/gateway
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/web
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/user
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/job
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/payment
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/chat
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/notification
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/bidding
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/fraud
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/imaging
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/pricing
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/trust
    newTag: v0.1.0
  - name: ghcr.io/nomarkup/underwriting
    newTag: v0.1.0

patches:
  # Gateway: 1 replica in staging
  - target:
      kind: Deployment
      name: gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Web: 1 replica in staging
  - target:
      kind: Deployment
      name: web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Go services: 1 replica each in staging
  - target:
      kind: Deployment
      name: user
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: job
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: payment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: chat
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: notification
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  # Rust engines: 1 replica each in staging
  - target:
      kind: Deployment
      name: bidding
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: fraud
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: trust
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: imaging
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: pricing
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: underwriting
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

configMapGenerator:
  - name: nomarkup-config
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=debug
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - MEILISEARCH_URL=http://meilisearch:7700
      # Audit S2 — mandatory env vars (services fail-closed without these).
      # JWT issuer/audience pin the JWT validator to this environment so a
      # token minted for production cannot be accepted in staging.
      - JWT_ISSUER=https://auth.staging.no-markup.com
      - JWT_AUDIENCE=nomarkup-staging
      # CSWSH defense — only these origins may upgrade to a WebSocket.
      - WS_ALLOWED_ORIGINS=https://staging.no-markup.com,https://app.staging.no-markup.com
      # XFF trust boundary — only requests from these CIDRs may set the
      # X-Forwarded-For header that the rate limiter / audit log trusts.
      - TRUSTED_PROXIES=10.0.0.0/8
      # OAuth aud claims (S4 + Apple OAuth signature verification).
      - APPLE_CLIENT_ID=com.nomarkup.app.staging
      - GOOGLE_CLIENT_ID=REPLACE_ME_STAGING_GOOGLE_CLIENT_ID.apps.googleusercontent.com
