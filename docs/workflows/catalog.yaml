    method: GET
    path: /api/v1/admin/disputes
    status: 200
    deny:
      customer: 403
      provider: 403
      provider2: 403
    vcr: fixtures/account.admin.disputes.json

  - id: account.admin.fraud
    label: Admin fraud alerts
    persona: admin
    ios: account.row.admin
    web: /admin/fraud
    method: GET
    path: /api/v1/admin/fraud/alerts
    status: 200
    deny:
      customer: 403
      provider: 403
      provider2: 403
    vcr: fixtures/account.admin.fraud.json

  - id: account.admin.jobs
    label: Admin jobs
    persona: admin
    ios: account.row.admin
    web: /admin/jobs
    method: GET
    path: /api/v1/admin/jobs
    status: 200
    deny:
      customer: 403
      provider: 403
      provider2: 403
    vcr: fixtures/account.admin.jobs.json

  - id: account.admin.fees
    label: Admin fee config
    persona: admin
    ios: account.row.admin
