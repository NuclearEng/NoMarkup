# Named API workflows. Full web page inventory: pages.json (App Router routes).
# iOS: every TAP/SCREEN/HTTP hop is recorded in Account → Request log regardless of this file.
# Join to client request log + gateway request_id.
# status: expected HTTP on the primary hop. Arrays are allowed classes (VCR picks one).
# yaml is SSOT; catalog.json is generated (node docs/workflows/generate-catalog.mjs).
version: 1
personas: [customer, provider, provider2, admin]
workflows:
  - id: auth.login
    label: Sign in
    ios: login.submit
    web: /login
    method: POST
    path: /api/v1/auth/login
    status: 200
    vcr: fixtures/auth.login.json

  - id: account.me
    label: Load Account hub
    ios: account.row.profile
    web: /settings/account
    method: GET
    path: /api/v1/users/me
    status: 200
    vcr: fixtures/account.me.json

  - id: account.profile.save
    label: Save display name
    ios: account.row.profile
    web: /profile
    method: PATCH
    path: /api/v1/users/me
    status: [200]
    mutation: true
    vcr: fixtures/account.profile.save.json

  - id: account.security
    label: Security settings
    ios: account.row.security
    web: /settings/security
    method: GET
    path: /api/v1/users/me
    status: 200
    vcr: fixtures/account.security.json

  - id: account.verification
    label: Verify email & phone
    ios: account.row.verification
    web: /settings/account
    method: POST
    path: /api/v1/auth/resend-verification
    status: [200, 204]
    mutation: true
    vcr: fixtures/account.verification.json

  - id: account.post_job
    label: Post a job
    ios: account.row.postJob
    web: /jobs/new
    method: POST
    path: /api/v1/jobs
    status: [201, 400]
    mutation: true
    vcr: fixtures/account.post_job.json

  - id: account.sell
    label: List an item
    ios: account.row.sell
    web: /sell/new
    method: POST
    path: /api/v1/listings
    status: [201, 400]
    mutation: true
    vcr: fixtures/account.sell.json

  - id: account.orders
    label: Orders list
    ios: account.row.orders
    web: /orders
    method: GET
    path: /api/v1/me/orders
    status: [200, 404]
    vcr: fixtures/account.orders.json

  - id: account.contracts
    label: Contracts list
    ios: account.row.contracts
    web: /contracts
    method: GET
    path: /api/v1/contracts
    status: 200
    vcr: fixtures/account.contracts.json

  - id: account.bids
    label: My bids
    ios: account.row.myBids
    web: /bids
    method: GET
    path: /api/v1/bids/mine
    status: 200
    vcr: fixtures/account.bids.json

  - id: account.listings
    label: My listings
    ios: account.row.myListings
    web: /sell/mine
    method: GET
    path: /api/v1/listings/mine
    status: [200, 404]
    vcr: fixtures/account.listings.json

  - id: account.watchlist
    label: Watchlist
    ios: account.row.watchlist
    web: /me/watchlist
    method: GET
    path: /api/v1/me/watchlist
    status: [200, 404]
    vcr: fixtures/account.watchlist.json

  - id: account.payment_methods
    label: Payment methods
    ios: account.row.paymentMethods
    web: /settings/payment-methods
    method: GET
    path: /api/v1/payments/methods
    status: [200, 404]
    vcr: fixtures/account.payment_methods.json

  - id: account.notifications
    label: Notifications
    ios: account.row.notifications
    web: /notifications
    method: GET
    path: /api/v1/notifications
    status: 200
    vcr: fixtures/account.notifications.json

  - id: account.notification_prefs.save
    label: Save notification preferences
    ios: account.row.notificationPreferences
    web: /settings/notifications
    method: PUT
    path: /api/v1/notifications/preferences
    status: [200]
    mutation: true
    vcr: fixtures/account.notification_prefs.save.json

  - id: account.plan_limits
    label: Plan limits
    ios: account.row.planLimits
    web: /settings/subscription
    method: GET
    path: /api/v1/subscriptions/tiers
    status: 200
    vcr: fixtures/account.plan_limits.json

  - id: account.plan_limits.enforce
    label: Reject over-cap bid
    ios: account.row.planLimits
    web: /jobs
    method: POST
    path: /api/v1/jobs/{id}/bids
    status: [400, 403, 404]
    mutation: true
    vcr: fixtures/account.plan_limits.enforce.json

  - id: account.export
    label: Export data
    ios: account.row.exportData
    web: /settings/account
    method: GET
    path: /api/v1/users/me/export
    status: [200]
    mutation: true
    vcr: fixtures/account.export.json

  - id: account.sign_out
    label: Sign out
    ios: account.row.signOut
    web: /login
    method: POST
    path: /api/v1/auth/logout
    status: [200, 204]
    mutation: true
